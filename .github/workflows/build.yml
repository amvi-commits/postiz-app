---
name: Build

on:
  workflow_dispatch:
  push:
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  video-tools-contracts:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'feature/sns-studio-video-tools-ai' || github.ref_name == 'feature/sns-studio-bmode-real-e2e' || github.ref_name == 'feature/sns-studio-threads-inline-ui' || github.event.pull_request.number == 27 || github.event.pull_request.number == 29
    uses: ./.github/workflows/video-tools-contract.yml
    permissions:
      contents: read
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sns_studio_threads_inline_e2e
        ports: ['5549:5432']
        options: --health-cmd "pg_isready -U postgres -d sns_studio_threads_inline_e2e" --health-interval 5s --health-retries 10
    env:
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4290/api
      FRONTEND_URL: http://127.0.0.1:4290
      STORAGE_PROVIDER: local
      NEXT_TELEMETRY_DISABLED: '1'
      OTEL_ENABLED: 'false'
    

    strategy:
      matrix:
        node-version: ['22.12.0']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record the source under test
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          printf 'event=%s pr=%s base=%s head=%s checkout=%s\n' "$EVENT" "$PR_NUMBER" "$BASE_SHA" "$HEAD_SHA" "$(git rev-parse HEAD)"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

#      - name: Setup pnpm cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ${{ env.STORE_PATH }}
#            ${{ github.workspace }}/.next/cache
#          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
#          restore-keys: |
#            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate Prisma without connecting to a database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5548/sns_studio_bmode_e2e?schema=public
        run: |
          pnpm exec prisma validate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma
          pnpm exec prisma generate --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma

      - name: Build
        run: pnpm run build

      - name: Backend strict and frontend typecheck
        run: |
          pnpm exec tsc --noEmit -p apps/backend/tsconfig.json
          pnpm exec tsc --noEmit -p apps/frontend/tsconfig.json

      - name: Isolated Threads editor browser and draft persistence regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5549/sns_studio_threads_inline_e2e?schema=public
          THREADS_BROWSER_ALLOW_REAL_POST: 'false'
        run: |
          node -e 'const u=new URL(process.env.DATABASE_URL); if(u.hostname!=="localhost"||u.port!=="5549"||u.pathname!=="/sns_studio_threads_inline_e2e") throw Error("Unrecognized disposable Threads DB");'
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm exec prisma db push --schema libraries/nestjs-libraries/src/database/prisma/schema.prisma --skip-generate
          node .github/scripts/threads-inline-browser-e2e.cjs
