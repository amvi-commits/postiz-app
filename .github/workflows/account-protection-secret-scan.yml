name: Account Protection secret scan

on:
  pull_request:
  push:
    branches:
      - feature/sns-studio-account-protection

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks v8.30.0
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.0
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep " $archive$" checksums.txt | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      - name: Scan working tree and git history
        shell: bash
        run: |
          set -euo pipefail
          ./gitleaks dir . --redact --exit-code 1
          ./gitleaks git . --redact --exit-code 1
