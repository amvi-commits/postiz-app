name: Account Protection secret scan

on:
  pull_request:
  push:
    branches:
      - feature/sns-studio-account-protection

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download and verify Gitleaks v8.30.0
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.0
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive$" checksums.txt | sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$GITLEAKS_BIN" version
          rm -f "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/checksums.txt"
      - name: Current tree scan
        shell: bash
        run: python3 .github/scripts/gitleaks-report.py scan current
      - name: PR introduced range scan
        shell: bash
        run: python3 .github/scripts/gitleaks-report.py scan pr-range
      - name: Base history scan
        shell: bash
        run: python3 .github/scripts/gitleaks-report.py scan base-history
      - name: Full git history scan
        shell: bash
        run: python3 .github/scripts/gitleaks-report.py scan history
      - name: Sanitize, classify, and enforce findings
        if: always()
        shell: bash
        run: python3 .github/scripts/gitleaks-report.py summary

